version: "3.8"
services:
   ccserver:
      build:
         context: .
         dockerfile: Dockerfile
      command: ["java", "-cp", "/app/g2gnet-1.0-SNAPSHOT.jar", "org.geooo.CCServer"]
      networks:
         custom_net:
            ipv4_address: 172.20.0.10
   server1:
      build:
         context: .
         dockerfile: Dockerfile
      command: ["java", "-cp", "/app/g2gnet-1.0-SNAPSHOT.jar", "org.geooo.HostServer"]
      networks:
         custom_net:
            ipv4_address: 172.20.0.11
      depends_on:
         - ccserver
   server2:
      build:
         context: .
         dockerfile: Dockerfile
      command:
         ["java", "-cp", "/app/g2gnet-1.0-SNAPSHOT.jar", "org.geooo.HostServer"]
      networks:
         custom_net:
            ipv4_address: 172.20.0.12
      depends_on:
         - server1
   server3:
      build:
         context: .
         dockerfile: Dockerfile
      command:
         ["java", "-cp", "/app/g2gnet-1.0-SNAPSHOT.jar", "org.geooo.HostServer"]
      networks:
         custom_net:
            ipv4_address: 172.20.0.13
      depends_on:
         - server2
   client:
      build:
         context: .
         dockerfile: Dockerfile
      command: ["./vnc-startup.sh"]
      networks:
         custom_net:
            ipv4_address: 172.20.0.20
      ports:
         - "5901:5901"  # Expose VNC port to host
      # Remove these X11 forwarding lines - they conflict with VNC
      # environment:
      #   - DISPLAY=:1
      # volumes:
      #   - /tmp/.X11-unix:/tmp/.X11-unix:rw
      #   - ~/.Xauthority:/root/.Xauthority:rw
      depends_on:
         - server3
      stdin_open: true
      tty: true
networks:
   custom_net:
      driver: bridge
      ipam:
         config:
            - subnet: 172.20.0.0/16