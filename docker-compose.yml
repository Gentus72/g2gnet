version: "3.8"
services:
  ccserver1:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["java", "-cp", "/app/g2gnet-1.0-SNAPSHOT.jar", "org.geooo.CCServer"]
    networks:
      custom_net:
        ipv4_address: 172.20.0.10
  server1_1:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["java", "-cp", "/app/g2gnet-1.0-SNAPSHOT.jar", "org.geooo.HostServer"]
    networks:
      custom_net:
        ipv4_address: 172.20.0.11
    depends_on:
      - ccserver1
  server1_2:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      ["java", "-cp", "/app/g2gnet-1.0-SNAPSHOT.jar", "org.geooo.HostServer"]
    networks:
      custom_net:
        ipv4_address: 172.20.0.12
    depends_on:
      - server1_1
  server1_3:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      ["java", "-cp", "/app/g2gnet-1.0-SNAPSHOT.jar", "org.geooo.HostServer"]
    networks:
      custom_net:
        ipv4_address: 172.20.0.13
    depends_on:
      - server1_2
  client:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./vnc-startup.sh"]
    networks:
      custom_net:
        ipv4_address: 172.20.0.20
    ports:
      - "5901:5901" # vnc
    depends_on:
      - server1_3
    stdin_open: true
    tty: true
networks:
  custom_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16